services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geo-postgres
    environment:
      POSTGRES_DB: geoproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoproject"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/geoproject
      DB_USER: postgres
      DB_PASS: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: