databaseChangeLog:
  - changeSet:
      id: 002-create-import-jobs-table
      author: geo-project
      changes:
        - createTable:
            tableName: import_jobs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: place_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: total_fetched
                  type: INTEGER
              - column:
                  name: total_saved
                  type: INTEGER
              - column:
                  name: total_enriched
                  type: INTEGER
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_import_jobs_status
            tableName: import_jobs
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_import_jobs_city
            tableName: import_jobs
            columns:
              - column:
                  name: city
